<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#0a0a0c">
<title>{% block titolo %}cleanvid{% endblock %}</title>
<style>
:root{
  --sfondo:#0a0a0c; --scheda:#131317; --linea:#26262e;
  --testo:#ececed; --spento:#8f8f9b; --tenue:#5f5f6b; --accento:#7aa2f7;
  --raggio:12px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--sfondo);color:var(--testo);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--accento)}
:focus-visible{outline:2px solid var(--accento);outline-offset:2px;border-radius:6px}

.pagina{width:100%;max-width:960px;margin:0 auto;padding:0 20px 56px}
.testata{display:flex;align-items:center;justify-content:space-between;
  padding:18px 0;gap:14px}
.marchio{font-weight:650;letter-spacing:-.01em;text-decoration:none;color:var(--testo)}
.marchio span{color:var(--accento)}
.chi{color:var(--tenue);font-size:12.5px}

h1{font-size:clamp(26px,4.4vw,42px);line-height:1.1;letter-spacing:-.025em;
  margin:28px 0 12px;font-weight:700}
h1 .spento{color:var(--tenue)}
.guida{color:var(--spento);font-size:15px;max-width:52ch;margin:0 0 26px}

form.apri{display:flex;gap:10px;flex-wrap:wrap;max-width:620px}
input[type=url]{flex:1 1 260px;min-width:0;padding:13px 16px;border-radius:var(--raggio);
  border:1px solid #2e2e38;background:#101014;color:var(--testo);font:inherit;font-size:15px}
input[type=url]::placeholder{color:var(--tenue)}
input[type=url]:focus{outline:none;border-color:var(--accento);background:#0d0d11}
button.principale{padding:13px 22px;border-radius:var(--raggio);border:1px solid #3a4a6b;
  background:#1d2842;color:#cfe0ff;font:inherit;font-size:15px;font-weight:550;cursor:pointer}
button.principale:hover{background:#243256;color:#fff}

.sezione{margin-top:38px}
.sezione h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--spento);font-weight:600;margin:0 0 12px;padding-bottom:10px;
  border-bottom:1px solid var(--linea)}
.elenco{list-style:none;margin:0;padding:0}
.elenco li{display:flex;gap:10px;align-items:center;padding:9px 8px;margin:0 -8px;
  border-radius:8px}
.elenco li:hover{background:#1b1b21}
.elenco a{color:#dcdce0;text-decoration:none;flex:1;min-width:0;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elenco a:hover{color:#fff}
.elenco .nota{color:var(--tenue);font-size:11.5px;white-space:nowrap}
.vuoto{color:var(--tenue);font-size:13px}

.palco{background:#000;border:1px solid var(--linea);border-radius:var(--raggio);
  overflow:hidden;aspect-ratio:16/9;margin:18px 0}
.palco iframe{width:100%;height:100%;border:0;display:block}
.avviso{background:#241416;border:1px solid #4d2329;border-radius:var(--raggio);
  padding:16px 18px;color:#ffc2c2;font-size:14px;line-height:1.55}
.avviso b{display:block;margin-bottom:6px;color:#ffd9d9}
.palco{position:relative}
.palco video{width:100%;height:100%;display:block;background:#000}
.barra{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:-4px 0 18px}
.etichetta{color:var(--spento);font-size:12.5px}
.etichetta .diretta{color:#ff6b6b;font-weight:600}
button.secondario,select{padding:7px 12px;border-radius:9px;border:1px solid #2e2e38;
  background:#17171d;color:#d6d6dc;font:inherit;font-size:13px;cursor:pointer}
button.secondario:hover,select:hover{background:#1f1f27;color:#fff}
.qualita{margin-left:auto}
.piede{margin-top:44px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tenue);font-size:12px}
@media (max-width:640px){ .pagina{padding:0 16px 40px} }
</style>

<div class=pagina>
  <header class=testata>
    <a class=marchio href="/">clean<span>vid</span></a>
    {% if utente %}<span class=chi>{{ utente.nome_visibile }}</span>{% endif %}
  </header>
  {% block contenuto %}{% endblock %}
  <footer class=piede>{% block piede %}{% endblock %}</footer>
</div>
{% block coda %}{% endblock %}
