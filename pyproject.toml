[project]
name = "cleanvid"
version = "0.1.0"
description = "Incolli il link di una pagina e resta il video."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",       # password: argon2, non bcrypt, non sha
    "itsdangerous>=2.2",       # cookie firmati
    "jinja2>=3.1",
    "httpx>=0.28",
    "yt-dlp>=2024.12.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
